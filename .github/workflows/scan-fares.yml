name: Scan 4-leg fares

on:
  schedule:
    - cron: '0 21 * * *'   # 每天 05:00 台北時間
  workflow_dispatch:
    inputs:
      days_ahead:
        description: '出發日為幾天後（規劃實際行程時可改，預設 60）'
        required: false
        default: '60'

permissions:
  contents: write
  pages: write
  id-token: write

# 獨立併發群組：與 pages/tdx 部署共用群組時，排隊中的長掃描會被
# 較新的佇列請求擠掉（GitHub 每組僅保留一個等候中 run）。
concurrency:
  group: scan-fares
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast-flights
        run: pip install fast-flights typing_extensions
      - name: Run scanner
        env:
          DAYS_AHEAD: ${{ inputs.days_ahead }}
        run: python scripts/scan_fares.py
      - name: Commit results
        id: commit
        run: |
          if git diff --quiet fares.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "fares-scanner"
            git config user.email "github-actions@users.noreply.github.com"
            git add fares.json
            git commit -m "chore: 更新四段票甜度掃描結果"
            # 掃描耗時較長，main 可能已前進：rebase 後再推，最多重試三次
            for i in 1 2 3; do
              git push && break
              git fetch origin main && git rebase origin/main || exit 1
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
