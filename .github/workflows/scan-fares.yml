name: Scan 4-leg fares

on:
  schedule:
    - cron: '0 21 * * *'   # 每天 05:00 台北時間
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast-flights
        run: pip install fast-flights typing_extensions
      - name: Debug multi-city payload (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python scripts/debug_multicity.py
      - name: Probe keyless API CORS (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          for u in \
            "https://api.adsb.lol/v2/point/25.08/121.23/100" \
            "https://api.airplanes.live/v2/point/25.08/121.23/100" \
            "https://metar.vatsim.net/RCTP" \
            "https://hexdb.io/api/v1/aircraft/899000" \
            "https://opensky-network.org/api/states/all?lamin=21.5&lamax=25.5&lomin=119&lomax=123"; do
            echo "===== $u"
            curl -s -m 20 -D - -o /tmp/body -H "Origin: https://chung223.github.io" "$u" | grep -iE "^(HTTP|access-control|content-type)" || true
            head -c 200 /tmp/body; echo
          done
      - name: Run scanner
        run: python scripts/scan_fares.py
      - name: Commit results
        id: commit
        run: |
          if git diff --quiet fares.json 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "fares-scanner"
            git config user.email "github-actions@users.noreply.github.com"
            git add fares.json
            git commit -m "chore: 更新四段票甜度掃描結果"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
