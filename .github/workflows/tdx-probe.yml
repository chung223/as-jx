name: TDX probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TDX_ID: ${{ secrets.TDX_CLIENT_ID || secrets.TDX_APP_ID || secrets.TDX_API_KEY || secrets.API_KEY }}
      TDX_SECRET: ${{ secrets.TDX_CLIENT_SECRET || secrets.TDX_APP_KEY || secrets.TDX_API_SECRET || secrets.API_SECRET }}
    steps:
      - name: Check secrets present
        run: |
          echo "TDX_ID: ${TDX_ID:+SET}${TDX_ID:-EMPTY}" | sed 's/SET.*/SET/'
          echo "TDX_SECRET: ${TDX_SECRET:+SET}${TDX_SECRET:-EMPTY}" | sed 's/SET.*/SET/'
      - name: Swagger endpoint list
        run: |
          curl -s -m 30 "https://tdx.transportdata.tw/webapi/File/Swagger/V3/eb87998f-2f9c-4592-8d75-c62e5b724962" -o /tmp/swagger.json
          echo "swagger bytes: $(wc -c < /tmp/swagger.json)"
          python3 -c "
          import json
          d = json.load(open('/tmp/swagger.json'))
          print('title:', d.get('info', {}).get('title'))
          for p in sorted(d.get('paths', {})): print(p)
          " | head -60
      - name: Get token and probe FIDS
        run: |
          TOKEN=$(curl -s -m 30 -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -d grant_type=client_credentials -d client_id="$TDX_ID" -d client_secret="$TDX_SECRET" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          echo "token: ${TOKEN:+OK(len=${#TOKEN})}${TOKEN:-FAILED}" | sed 's/OK.*/OK/'
          for u in \
            "https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Departure/TPE?%24top=2&%24format=JSON" \
            "https://tdx.transportdata.tw/api/basic/v2/Air/FIDS/Airport/Arrival/TPE?%24top=2&%24format=JSON"; do
            echo "===== $u"
            curl -s -m 30 -D /tmp/h -H "Authorization: Bearer $TOKEN" "$u" -o /tmp/b
            grep -iE "^(HTTP|x-rate|api-quota|retry)" /tmp/h || head -1 /tmp/h
            head -c 900 /tmp/b; echo
          done
