name: TDX airport boards

on:
  schedule:
    - cron: '15 * * * *'  # 每小時（原每 30 分）；避開姊妹站快轉的抓取窗口，共用 TDX 金鑰額度
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fids:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      TDX_ID: ${{ secrets.TDX_CLIENT_ID || secrets.TDX_APP_ID || secrets.TDX_API_KEY || secrets.API_KEY }}
      TDX_SECRET: ${{ secrets.TDX_CLIENT_SECRET || secrets.TDX_APP_KEY || secrets.TDX_API_SECRET || secrets.API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tdx.json 不進版控、只存在於上一次部署。額度不足時抓取會溫和跳過，
      # 若不先取回舊檔，這輪就會部署出一個沒有看板資料的站台。
      - name: 取回線上既有看板（降級時沿用）
        run: curl -fsS -o tdx.json https://chung223.github.io/as-jx/tdx.json || echo "（線上尚無 tdx.json，略過）"
      - name: Fetch FIDS boards
        run: python scripts/tdx_fids.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
