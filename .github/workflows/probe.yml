name: Probe CI award chart
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract PDF
        run: |
          U="https://cms-externalcontent-prod.s3.ap-northeast-1.amazonaws.com/ci/Member/Announcement/RT-zh.pdf"
          curl -sL -m 60 -o /tmp/ci.pdf "$U"
          echo "bytes: $(wc -c < /tmp/ci.pdf)"; file /tmp/ci.pdf
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          echo "===== LAYOUT ====="
          pdftotext -layout -enc UTF-8 /tmp/ci.pdf - | head -c 12000
