name: Probe aviation APIs
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for u in \
            "https://api.planespotters.net/pub/photos/hex/89904E" \
            "https://date.nager.at/api/v3/PublicHolidays/2026/JP" \
            "https://date.nager.at/api/v3/PublicHolidays/2026/TH" \
            "https://date.nager.at/api/v3/PublicHolidays/2026/ID" \
            "https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/2026.json"; do
            echo "===== $u"
            curl -s -m 20 -A "$UA" -D - -o /tmp/body -H "Origin: https://chung223.github.io" "$u" | grep -iE "^(HTTP|access-control-allow-origin|content-type)" || true
            head -c 320 /tmp/body; echo
          done
