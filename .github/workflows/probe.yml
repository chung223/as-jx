name: Probe FX endpoints
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://api.frankfurter.dev/v1/latest?from=TWD&to=USD,JPY,HKD,EUR" \
            "https://api.frankfurter.dev/v1/2026-07-05..2026-08-04?from=USD&to=TWD" \
            "https://api.frankfurter.app/latest?from=TWD&to=USD" \
            "https://open.er-api.com/v6/latest/USD"; do
            echo "===== $u"
            curl -s -m 15 -D - -o /tmp/body -H "Origin: https://chung223.github.io" "$u" | grep -iE "^(HTTP|access-control|location)" || true
            head -c 260 /tmp/body; echo
          done
