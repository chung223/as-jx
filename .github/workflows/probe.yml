name: Probe TDX schedule API
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TDX_ID: ${{ secrets.TDX_CLIENT_ID || secrets.TDX_APP_ID || secrets.TDX_API_KEY || secrets.API_KEY }}
      TDX_SECRET: ${{ secrets.TDX_CLIENT_SECRET || secrets.TDX_APP_KEY || secrets.TDX_API_SECRET || secrets.API_SECRET }}
    steps:
      - name: 探測 TDX 定期時刻表端點
        run: |
          TOKEN=$(curl -s -m 30 -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -d grant_type=client_credentials -d client_id="$TDX_ID" -d client_secret="$TDX_SECRET" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          echo "token: ${TOKEN:+OK}${TOKEN:-FAILED}"
          B="https://tdx.transportdata.tw/api/basic/v2/Air"
          for p in \
            "GeneralSchedule/International?%24top=2&%24format=JSON" \
            "GeneralSchedule/Domestic?%24top=2&%24format=JSON" \
            "Airport?%24top=2&%24format=JSON" \
            "Airline?%24top=2&%24format=JSON"; do
            echo "===== $p"
            sleep 13
            curl -s -m 30 -D /tmp/h -H "Authorization: Bearer $TOKEN" "$B/$p" -o /tmp/b
            head -1 /tmp/h; grep -i "^x-ratelimit-remaining" /tmp/h || true
            head -c 700 /tmp/b; echo
          done
          echo "===== 星宇 JX 國際定期班表（找新航線用）"
          sleep 13
          curl -s -m 30 -H "Authorization: Bearer $TOKEN" \
            "$B/GeneralSchedule/International?%24filter=AirlineID%20eq%20'JX'&%24top=5&%24format=JSON" \
            | head -c 900; echo
